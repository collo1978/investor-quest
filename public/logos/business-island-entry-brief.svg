<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title description">
  <title id="title">Welcome to Business Island</title>
  <desc id="description">A mission briefing explaining the learner's Business Island objective.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>
  <rect x="30" y="24" width="964" height="1488" rx="52" fill="#d4a952" filter="url(#shadow)"/>
  <rect x="46" y="40" width="932" height="1456" rx="42" fill="#edcf8b" filter="url(#paper)"/>
  <rect x="88" y="112" width="848" height="344" rx="18" fill="none" stroke="#74150f" stroke-width="14"/>
  <rect x="108" y="132" width="808" height="304" rx="10" fill="none" stroke="#74150f" stroke-width="4"/>
  <g fill="#74150f" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="265" font-size="82" letter-spacing="2">WELCOME TO</text>
    <text x="512" y="370" font-size="78" letter-spacing="1">BUSINESS ISLAND</text>
  </g>
  <path d="M95 510h834" stroke="#74150f" stroke-width="4"/>
  <g fill="#17130d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="512" y="605" font-size="35" font-weight="700">
      <tspan x="512">You’re about to explore the Business section</tspan>
      <tspan x="512" dy="58">of NVIDIA’s 10-K Annual Report.</tspan>
    </text>
    <text x="512" y="770" font-size="37" font-weight="700">
      <tspan x="512">It’s over 5,000 words long.</tspan>
      <tspan x="512" dy="58">We’ve extracted only what matters.</tspan>
    </text>
  </g>
  <path d="M95 914h834" stroke="#74150f" stroke-width="4"/>
  <text x="512" y="1045" fill="#74150f" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="82" font-weight="900" text-anchor="middle">YOUR MISSION</text>
  <path d="M248 1074h528" stroke="#74150f" stroke-width="9"/>
  <g fill="#17130d" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    <text x="512" y="1190">
      <tspan x="512">Complete the checklist to understand</tspan>
      <tspan x="512" dy="62">NVIDIA’s business like a pro.</tspan>
    </text>
  </g>
  <path d="M95 1360h834" stroke="#74150f" stroke-width="4"/>
</svg>
